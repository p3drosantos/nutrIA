version: "3.8"

services:
  postgres:
    image: postgres:15
    container_name: treino-postgres
    restart: always
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: treino
    volumes:
      - treino-postgres-data:/var/lib/postgresql/data

volumes:
  treino-postgres-data:
